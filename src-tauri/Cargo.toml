[package]
name = "quake-companion"
version = "0.1.0"
description = "Quake Companion desktop app for the Decokee QUAKE display panel"
authors = ["Phillip"]
edition = "2021"
rust-version = "1.77"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = [], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hidapi = "2"
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread", "time", "macros"] }
sysinfo = "0.32"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"

[features]
# Enables the Tauri runtime (window, IPC, events). The non-tauri core
# (hid/device/stats) compiles without it, so the protocol + device logic can be
# type-checked on hosts that lack the webkit2gtk system libraries:
#   cargo check --no-default-features
default = ["tauri-runtime"]
tauri-runtime = ["dep:tauri", "dep:tauri-build"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true